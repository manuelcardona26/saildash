name: Lanzamiento

# SailDash: al empujar una etiqueta vX.Y.Z (igual a VERSION_NAME de version.properties), GitHub
# compila el APK firmado y crea el Release. La pantalla del carro lo encuentra en
# Ajustes → Sistema → Actualizaciones. Repos públicos: los minutos de Actions son gratis.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Revisar que la etiqueta coincida con version.properties
        run: |
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con VERSION_NAME=$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SAILDASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SAILDASH_KEYSTORE_BASE64: los APK de GitHub siempre van firmados con la llave real"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saildash.jks"
          echo "LITEDASH_STORE_FILE=$RUNNER_TEMP/saildash.jks" >> "$GITHUB_ENV"

      # Solo el APK de GitHub (Irving, 2026-11-03): el .aab para las tiendas se genera a mano
      # el día que él lo pida (`./gradlew bundlePlayRelease` con la llave real).
      - name: Compilar APK
        env:
          SAILDASH_REPO: ${{ github.repository }}
          LITEDASH_STORE_PASSWORD: ${{ secrets.SAILDASH_STORE_PASSWORD }}
          LITEDASH_KEY_ALIAS: ${{ secrets.SAILDASH_KEY_ALIAS }}
          LITEDASH_KEY_PASSWORD: ${{ secrets.SAILDASH_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease -Psaildash.repo="$SAILDASH_REPO" --console=plain

      - name: Armar archivos y notas
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/saildash-$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          # Nombre fijo para el enlace directo: releases/latest/download/saildash.apk (fuera de SHA256SUMS).
          cp "out/saildash-$VERSION.apk" out/saildash.apk
          # Notas = la sección de esta versión en CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versión $VERSION." > notes.md

      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          case "$VERSION" in *-beta.*|*-rc.*) extra="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --title "SailDash $VERSION" --notes-file notes.md $extra
